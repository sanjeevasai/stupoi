<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Attendance - Student Portal
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


<nav class="navbar">

    <div class="logo">
        Student Portal
    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="timetable.html">
            Timetable
        </a>

        <a href="notes.html">
            Notes
        </a>

        <a href="attendance.html">
            Attendance
        </a>

    </div>

    <button
        class="btn danger"
        onclick="logout()"
    >
        Logout
    </button>

</nav>


<main class="main">

    <div class="page-title">

        <h1>
            Attendance
        </h1>

        <p class="muted">

            Track attendance for every subject.

        </p>

    </div>


    <!-- SUBJECT ATTENDANCE -->

    <section class="panel">

        <h2>
            Subject-wise Attendance
        </h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Subject
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Present
                        </th>

                        <th>
                            Absent
                        </th>

                        <th>
                            Percentage
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="attendanceBody"
                >
                </tbody>

            </table>

        </div>

    </section>


    <!-- HISTORY -->

    <section class="panel">

        <h2>
            Attendance History
        </h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Subject
                        </th>

                        <th>
                            Time
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="historyBody"
                >
                </tbody>

            </table>

        </div>

    </section>

</main>


<script src="common.js"></script>

<script src="attendance.js"></script>


</body>

</html>
